name: Publish TB Gingen Bulls I
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh TB Gingen Bulls I data and calendar from DVOS
        run: node scripts/update-bulls-calendar.mjs
      - name: Refresh separate multi-team test app data
        run: node scripts/update-bulls-teams.mjs
        continue-on-error: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait for GitHub Pages artifact indexing
        run: sleep 20
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
