/* Steel-Darts-Design: dunkles Board, rote Doubles und grüner Bullseye-Akzent */
:root{--navy:#0c1118;--navy2:#1a222d;--red:#ed3152;--ink:#edf1f6;--muted:#a1adbd;--line:#394453;--paper:#11171f;--card:#1b242f;--green:#91e34c;--amber:#ffc05a;--shadow:0 10px 28px rgba(0,0,0,.24)}
body{background:radial-gradient(circle at 15% 10%,rgba(237,49,82,.10),transparent 26%),radial-gradient(circle at 90% 45%,rgba(145,227,76,.06),transparent 25%),#10151c;color:var(--ink)}
.hero{background:linear-gradient(135deg,#080c12 0%,#18212d 58%,#222c39 100%);border-bottom:3px solid #ed3152}

.brand{color:#fff;letter-spacing:.1px}.subbrand{color:#c4ccd7}.season{border-color:rgba(145,227,76,.30);color:#e8ffd8;background:rgba(145,227,76,.09)}
.hero h1{letter-spacing:-.9px;text-transform:uppercase;font-size:25px}.hero p{color:#d5dce5}.heroInfo span{border-color:rgba(145,227,76,.2);background:rgba(145,227,76,.08);color:#e3f8d3}

body{padding-bottom:calc(156px + env(safe-area-inset-bottom))}
.bottomnav{padding:6px 7px calc(6px + env(safe-area-inset-bottom))}
.navinner{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;overflow:visible}

/* Echter Sieger – Hintergrundmarkierung für Heim- und Auswärtsteam */
.itemteams .match-winner{
  display:inline-block;
  padding:2px 7px;
  margin:0 -7px;
  border-radius:7px;
  color:#c9f8a7;
  background:rgba(145,227,76,.19);
  border:1px solid rgba(145,227,76,.38);
  font-weight:950;
  text-shadow:0 0 10px rgba(145,227,76,.18);
}
.itemteams .match-winner::after{content:"  ✓";color:#91e34c;font-weight:950}
.itemresult .winner-score{color:#a9ef75;font-weight:950;text-shadow:0 0 10px rgba(145,227,76,.24)}

/* Tabellenzonen: Plätze 1–2 Aufstieg, letzter Platz Abstieg */
.table tr.promotion td{background:rgba(145,227,76,.16);color:#efffe6}
.table tr.relegation td{background:rgba(237,49,82,.16);color:#ffe9ec}
.zoneLegend{display:inline-flex;align-items:center;gap:4px;margin-right:5px}
.zoneLegend i{display:inline-block;width:9px;height:9px;border-radius:3px}
.zoneGreen{background:#cceacb}.zoneRed{background:#f4cccc}
/* Eigene Mannschaft neutral grau markieren – auch wenn sie auf einem Randplatz steht */
.table tr.ourteam td{background:rgba(148,163,184,.18);color:#e2e8f0;font-weight:850}
/* Bulls I werden auf einem Aufstiegsplatz dunkelgrün hervorgehoben */
.table tr.ourteam.promotion td{background:rgba(20,83,45,.92);color:#effff3;font-weight:900;border-top-color:rgba(134,239,172,.45);border-bottom-color:rgba(134,239,172,.45)}
.kasseFrame{display:block;width:100%;height:820px;max-height:78vh;min-height:620px;border:1px solid #3b4858;border-radius:13px;background:#151d27}
.kasseIntro{font-size:12px;color:#bac5d3;line-height:1.5}
.kasseAction{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:420px){.kasseFrame{height:760px;min-height:560px}}
.teamSwitch{position:relative;z-index:2;display:flex;align-items:center;gap:9px;margin-top:13px;max-width:100%;flex-wrap:wrap}.teamSwitch span{font-size:11px;font-weight:750;color:#c8d3e2}.teamSwitch select{appearance:none;background:#263241;border:1px solid #526174;color:#fff;border-radius:11px;padding:9px 30px 9px 12px;font-size:13px;font-weight:850;min-width:180px;max-width:100%}.teamSwitch select:focus{outline:2px solid rgba(145,227,76,.65);outline-offset:2px}.screen[hidden],.navlink[hidden],.card[hidden]{display:none!important}
